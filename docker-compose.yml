version: "3.9"

services:
  kitchen:
    build: ./kitchen
    ports:
      - "8001:8001"

  delivery:
    build: ./delivery
    ports:
      - "8002:8002"

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - kitchen
      - delivery

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus